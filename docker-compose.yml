# ===========================================================
# NeuroScreen — Docker Compose (Local Development)
# ===========================================================
# Production deployment:
#   Frontend → Vercel
#   Backend  → Render or Railway
#   DB/Auth  → Supabase (managed)
#
# This file is for optional local development only.
#
# Usage:
#   docker compose up --build
# ===========================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - BACKEND_ENV=development
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    volumes:
      - ./backend:/app
      - ./ml/models:/app/ml/models:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Note: Supabase runs as a managed service (supabase.com).
# For fully local Supabase, see: https://supabase.com/docs/guides/self-hosting/docker
# That setup is not included here to keep the local dev experience simple.
